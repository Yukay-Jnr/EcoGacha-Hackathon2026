<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoGacha — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">♻ EcoGacha</a>
    <div class="nav-links">
      <a href="scan.html" class="nav-link">Scan</a>
      <a href="leaderboard.html" class="nav-link">Leaderboard</a>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <main class="page dashboard-page">

    <div class="dashboard-hero">
      <div>
        <p class="greeting" id="greeting">Welcome back,</p>
        <h2 class="student-name" id="student-name">—</h2>
        <p class="matric" id="student-matric"></p>
      </div>
      <div class="token-badge">
        <span class="token-count" id="token-count">0</span>
        <span class="token-label">EcoTokens</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="stat-scans">0</span>
        <span class="stat-label">Total Scans</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-tokens">0</span>
        <span class="stat-label">Tokens Earned</span>
      </div>
      <div class="stat-card">
        <a href="scan.html" class="scan-cta">
          <span class="scan-icon">📷</span>
          <span>Scan Waste</span>
        </a>
      </div>
    </div>

    <!-- Redeem section -->
    <section class="card redeem-card">
      <h3 class="card-title">Redeem EcoTokens</h3>
      <p class="card-sub">Minimum 10 tokens per redemption.</p>
      <div class="redeem-row">
        <input type="number" id="redeem-amount" placeholder="Enter amount" min="10" />
        <button class="btn-primary" onclick="handleRedeem()">Redeem</button>
      </div>
      <p id="redeem-msg" class="form-msg"></p>
    </section>

    <!-- Scan history -->
    <section class="card">
      <h3 class="card-title">Recent Scans</h3>
      <div id="history-list" class="history-list">
        <p class="empty-state">No scans yet. <a href="scan.html">Start scanning!</a></p>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
  <script>
    const student = requireAuth();

    document.getElementById("greeting").textContent = `Welcome back,`;
    document.getElementById("student-name").textContent = student.name;
    document.getElementById("student-matric").textContent = student.matric_number;
    document.getElementById("token-count").textContent = student.tokens;
    document.getElementById("stat-scans").textContent = student.total_scans;
    document.getElementById("stat-tokens").textContent = student.tokens;

    async function loadHistory() {
      const data = await api(`/api/users/${student.id}/history`);
      const list = document.getElementById("history-list");
      if (!data.length) return;
      list.innerHTML = data.map(s => `
        <div class="history-item">
          <div class="history-left">
            <span class="waste-tag ${s.waste_category}">${capitalize(s.waste_category)}</span>
            <span class="history-tier tier-${s.gacha_tier.toLowerCase()}">${s.gacha_tier}</span>
          </div>
          <div class="history-right">
            <span class="history-tokens">+${s.tokens_earned} <small>tokens</small></span>
            <span class="history-date">${formatDate(s.scanned_at)}</span>
          </div>
        </div>
      `).join("");
    }

    async function handleRedeem() {
      const amount = parseInt(document.getElementById("redeem-amount").value);
      const msg = document.getElementById("redeem-msg");

      if (!amount || amount < 10) {
        msg.textContent = "Enter at least 10 tokens.";
        msg.className = "form-msg error";
        return;
      }

      const res = await api("/api/rewards/redeem", "POST", { student_id: student.id, amount });
      if (res.error) {
        msg.textContent = res.error;
        msg.className = "form-msg error";
      } else {
        msg.textContent = res.message;
        msg.className = "form-msg success";
        student.tokens -= amount;
        localStorage.setItem("student", JSON.stringify(student));
        document.getElementById("token-count").textContent = student.tokens;
        document.getElementById("stat-tokens").textContent = student.tokens;
      }
    }

    loadHistory();
  </script>
</body>
</html>
