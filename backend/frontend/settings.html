<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoGacha — Settings</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">♻ EcoGacha</a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="scan.html" class="nav-link">Scan</a>
      <a href="leaderboard.html" class="nav-link">Leaderboard</a>
      <a href="settings.html" class="nav-link nav-link-active">⚙️</a>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">☀️</button>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <main class="page">

    <div class="scan-header">
      <h2 class="page-title">⚙️ Settings</h2>
      <p class="page-sub">Manage your account details and preferences.</p>
    </div>

    <!-- Account info card -->
    <div class="card settings-profile-card">
      <div class="settings-avatar" id="settings-avatar">?</div>
      <div class="settings-profile-info">
        <p class="settings-display-name" id="settings-display-name">—</p>
        <p class="settings-display-matric" id="settings-display-matric">—</p>
        <p class="settings-display-email" id="settings-display-email">—</p>
      </div>
    </div>

    <!-- Edit account details -->
    <div class="card">
      <h3 class="card-title">Edit Account</h3>
      <p class="card-sub">Leave a field blank to keep it unchanged.</p>

      <div class="settings-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="edit-name" placeholder="Enter new name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="edit-email" placeholder="Enter new email" />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="edit-password" placeholder="At least 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="edit-password-confirm" placeholder="Repeat new password" />
        </div>

        <button class="btn-primary" onclick="saveChanges()">Save Changes</button>
        <p class="form-msg" id="edit-msg"></p>
      </div>
    </div>

    <!-- Appearance -->
    <div class="card">
      <h3 class="card-title">Appearance</h3>
      <p class="card-sub">Choose how EcoGacha looks for you.</p>
      <div class="settings-theme-row">
        <span>Dark Mode</span>
        <button class="theme-pill" id="theme-pill" onclick="toggleTheme()">🌙 Dark</button>
      </div>
    </div>

    <!-- Switch / Logout -->
    <div class="card">
      <h3 class="card-title">Account</h3>
      <p class="card-sub">Switch to a different student account.</p>
      <div class="settings-actions">
        <button class="btn-secondary settings-btn" onclick="switchAccount()">
          🔄 Switch Account
        </button>
        <button class="btn-danger settings-btn" onclick="logout()">
          🚪 Log Out
        </button>
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
  <script>
    const student = requireAuth();

    // Populate profile display
    document.getElementById("settings-avatar").textContent = student.name.charAt(0).toUpperCase();
    document.getElementById("settings-display-name").textContent = student.name;
    document.getElementById("settings-display-matric").textContent = student.matric_number;
    document.getElementById("settings-display-email").textContent = student.email || "—";

    // Keep theme pill label in sync
    function updateThemePill() {
      const theme = localStorage.getItem("theme") || "dark";
      const pill = document.getElementById("theme-pill");
      if (pill) pill.textContent = theme === "dark" ? "🌙 Dark" : "☀️ Light";
    }

    // Override toggleTheme to also update the pill
    const _origToggle = toggleTheme;
    window.toggleTheme = function() {
      _origToggle();
      updateThemePill();
    };

    updateThemePill();

    // Save changes
    async function saveChanges() {
      const name     = document.getElementById("edit-name").value.trim();
      const email    = document.getElementById("edit-email").value.trim();
      const password = document.getElementById("edit-password").value;
      const confirm  = document.getElementById("edit-password-confirm").value;
      const msg      = document.getElementById("edit-msg");

      msg.className = "form-msg";
      msg.textContent = "";

      if (password && password !== confirm) {
        msg.textContent = "Passwords do not match.";
        msg.classList.add("error");
        return;
      }

      if (!name && !email && !password) {
        msg.textContent = "Nothing to update — fill in at least one field.";
        msg.classList.add("error");
        return;
      }

      msg.textContent = "Saving...";

      const payload = {};
      if (name)     payload.name = name;
      if (email)    payload.email = email;
      if (password) payload.password = password;

      const res = await api(`/api/users/${student.id}/update`, "POST", payload);

      if (res.error) {
        msg.textContent = res.error;
        msg.classList.add("error");
      } else {
        // Update localStorage with new details
        const updated = { ...student, ...res.student };
        localStorage.setItem("student", JSON.stringify(updated));

        // Refresh displayed info
        document.getElementById("settings-avatar").textContent = updated.name.charAt(0).toUpperCase();
        document.getElementById("settings-display-name").textContent = updated.name;
        document.getElementById("settings-display-email").textContent = updated.email;

        // Clear inputs
        document.getElementById("edit-name").value = "";
        document.getElementById("edit-email").value = "";
        document.getElementById("edit-password").value = "";
        document.getElementById("edit-password-confirm").value = "";

        msg.textContent = res.message;
        msg.classList.add("success");
      }
    }

    // Switch account = logout and go to login
    function switchAccount() {
      localStorage.removeItem("student");
      window.location.href = "index.html";
    }

    // Enter key submits
    ["edit-name","edit-email","edit-password","edit-password-confirm"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") saveChanges();
      });
    });
  </script>
</body>
</html>
